# =============================================================================
# NewsLens-AI — Model Provider Configuration
# =============================================================================
# This file controls which LLM/embedding/VLM/OCR provider is used for each
# pipeline task. Swap providers here without changing any application code.
#
# API:
#   GET  /api/settings/model-bindings  — read current bindings
#   PUT  /api/settings/model-bindings  — update bindings (admin only)
#
# For local-only deployment: use the Ollama providers below.
# For hosted deployment: uncomment the hosted provider blocks and set
# the corresponding API key environment variables in .env.
# =============================================================================

providers:
  # ---------------------------------------------------------------------------
  # Local providers — no API key required; run via Ollama
  # ---------------------------------------------------------------------------

  ollama_chat:
    provider: ollama
    model: llama3.2:3b          # Smoke-test/dev model. Swap to llama3.1:70b for production.
    base_url: "http://ollama:11434"  # docker-compose service name; use localhost:11434 outside Docker
    context_window: 128000
    supports_vision: false
    supports_tool_use: true

  ollama_vlm:
    provider: ollama
    model: qwen2.5vl:7b         # Layout analysis VLM. Swap to qwen2.5vl:32b for better accuracy.
    base_url: "http://ollama:11434"
    context_window: 32768
    supports_vision: true
    supports_tool_use: true

  ollama_embed:
    provider: ollama
    model: nomic-embed-text
    base_url: "http://ollama:11434"
    embedding_dim: 768

  local_embed_bge:
    provider: local_sentence_transformers
    model: BAAI/bge-m3           # Strong multilingual model; ~2GB download on first use.
    embedding_dim: 1024

  tesseract_ocr:
    provider: tesseract
    lang: "eng+hin"              # Add ISO 639-2 language codes separated by + as needed.

  # ---------------------------------------------------------------------------
  # Hosted providers — uncomment and set API keys in .env to enable
  # ---------------------------------------------------------------------------

  groq_qwen:
    provider: groq
    model: qwen/qwen3.6-27b
    context_window: 128000
    supports_vision: false
    supports_tool_use: true

  groq_gpt_oss:
    provider: groq
    model: openai/gpt-oss-120b
    context_window: 128000
    supports_vision: false
    supports_tool_use: true

