# =============================================================================
# Task Bindings
# Map each pipeline task to a provider key defined above.
# Change the value to switch providers for that task (no code change needed).
# =============================================================================

task_bindings:
  # --- Query pipeline ---
  query_planner: ollama_chat      # Classifies queries + generates retrieval plans
  answerer: ollama_chat           # Synthesizes final answer with citations

  # --- Ingestion pipeline ---
  layout_analysis: ollama_vlm     # Per-page VLM layout analysis (requires supports_vision)
  article_segmentation: ollama_chat
  metadata_extraction: ollama_chat
  classification: ollama_chat

  # --- Embedding ---
  embedding: local_embed_bge      # Change to ollama_embed for lighter resource use

  # --- OCR ---
  ocr: tesseract_ocr
