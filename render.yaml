services:
  # 1. FastAPI Backend on Render Free Web Service (512 MB RAM)
  - type: web
    name: newslens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: RENDER_FREE_TIER
        value: "true"
      - key: STORAGE_BACKEND
        value: "minio"
      - key: LAPTOP_ADMIN_PIN
        sync: false
      - key: LAPTOP_TUNNEL_URL
        sync: false
      - key: LAPTOP_BRIDGE_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUD_S3_ENDPOINT
        sync: false
      - key: CLOUD_S3_ACCESS_KEY
        sync: false
      - key: CLOUD_S3_SECRET_KEY
        sync: false
      - key: CLOUD_S3_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: "production"

  # 2. React 18 + Vite Frontend on Render Free Static Site
  - type: web
    name: newslens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://newslens-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
