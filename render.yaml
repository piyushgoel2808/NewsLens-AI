services:
  # 1. FastAPI Backend on Render Free Web Service (512 MB RAM)
  - type: web
    name: newslens-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: RENDER_FREE_TIER
        value: "true"
      - key: STORAGE_BACKEND
        value: "minio"
      - key: LAPTOP_ADMIN_PIN
        value: "1234"
      - key: LAPTOP_TUNNEL_URL
        value: "https://wesley-xbox-nations-decision.trycloudflare.com"
      - key: LAPTOP_BRIDGE_SECRET
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        value: "redis://localhost:6379/0"
      - key: MINIO_ENDPOINT
        value: "localhost:9000"
      - key: MINIO_ACCESS_KEY
        value: "minioadmin"
      - key: MINIO_SECRET_KEY
        value: "minioadmin123"
      - key: HF_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUD_S3_ENDPOINT
        value: ""
      - key: CLOUD_S3_ACCESS_KEY
        value: ""
      - key: CLOUD_S3_SECRET_KEY
        value: ""
      - key: CLOUD_S3_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: "production"

  # 2. React 18 + Vite Frontend on Render Free Static Site
  - type: web
    name: newslens-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://newslens-backend-kzyv.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
