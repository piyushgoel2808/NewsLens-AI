providers:
  gemini_flash:
    provider: gemini
    model: gemini-3.8-flash
    context_window: 1048576
    max_output_tokens: 8192
    supports_vision: true
    supports_tool_use: true
  gemini_vision:
    provider: gemini
    model: gemini-3.8-flash
    context_window: 1048576
    max_output_tokens: 8192
    supports_vision: true
    supports_tool_use: true
  local_embed_bge:
    provider: local_sentence_transformers
    model: BAAI/bge-m3
    supports_vision: false
    supports_tool_use: false
    embedding_dim: 1024
  google_cloud_vision:
    provider: google_cloud_vision
    supports_vision: true
    supports_tool_use: false
  docling_parser:
    provider: docling
    model: doclaynet-rapidocr
    supports_vision: true
    supports_tool_use: false

task_bindings:
  query_planner: gemini_flash
  answerer: gemini_flash
  synthesizer: gemini_flash
  visual_extraction: gemini_vision
  layout_analysis: gemini_flash
  metadata_extraction: gemini_flash
  classification: gemini_flash
  article_segmentation: gemini_flash
  query_condenser: gemini_flash
  document_parser: docling_parser
  ocr: google_cloud_vision
  scanned_page_segmentation: gemini_flash   # GFVS Phase 1 provider (Gemini Flash Vision)
  embedding: local_embed_bge
