[project]
name = "newslens-ai-backend"
version = "0.1.0"
description = "NewsLens-AI backend: Newspaper Intelligence Agentic RAG system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "celery[redis]>=5.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "qdrant-client>=1.11.3",
    "minio>=7.2.9",
    "anthropic>=0.34.2",
    "openai>=1.43.0",
    "ollama>=0.3.3",
    "sentence-transformers>=3.1.0",
    "pymupdf>=1.24.10",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.28",
    "python-json-logger>=2.0.7",
    "pyyaml>=6.0.2",
    "redis[hiredis]>=5.0.8",
    "aiofiles>=24.1.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "types-pyyaml>=6.0.12",
    "types-aiofiles>=24.1.0",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in function defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                              # allow assert in tests
"app/models/*" = ["F821"]                         # SQLAlchemy cross-module forward refs
"app/storage/mysql_fulltext.py" = ["E501"]        # SQL strings exceed line limit
"app/api/routers/models.py" = ["E501"]            # long return string
"app/models/newspaper.py" = ["E501"]              # long constraint name

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_calls = false
ignore_missing_imports = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "pymupdf",
    "pymupdf.*",
    "fitz",
    "fitz.*",
    "magic_pdf",
    "magic_pdf.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
]
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
