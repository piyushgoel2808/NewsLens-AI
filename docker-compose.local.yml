version: "3.9"

# =============================================================================
# NewsLens-AI — Local Development docker-compose
# =============================================================================
# Brings up all infrastructure services needed to run NewsLens-AI locally.
# No application code runs here — start the backend and frontend separately.
#
# Usage:
#   make up          # start all services
#   make down        # stop all services
#   docker compose -f docker-compose.local.yml logs -f <service>
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MySQL 8 — system of record
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0.39
    container_name: newslens-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-newslens_root}
      MYSQL_DATABASE: ${MYSQL_DB:-newslens}
      MYSQL_USER: ${MYSQL_USER:-newslens}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-newslens_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "--password=${MYSQL_ROOT_PASSWORD:-newslens_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M

  # ---------------------------------------------------------------------------
  # Qdrant — vector store
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: newslens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — object storage (S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: newslens-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + result backend + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: newslens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama — local LLM / VLM server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.12
    container_name: newslens-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # --- NVIDIA GPU support (uncomment to enable) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# =============================================================================
# Named volumes (persisted across container restarts)
# =============================================================================
volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
